<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Melika ❤️ Alireza</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:tahoma;
}

body{
background:#fff;
overflow:hidden;
height:100vh;
}

.slideshow{
position:fixed;
width:100%;
height:100%;
z-index:1;
}

.slide{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
opacity:0;
transition:opacity 2s;
}

.slide.active{
opacity:1;
}

.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(3px);
z-index:2;
}

.content{
position:relative;
z-index:3;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
color:#b30024;
text-shadow:0 0 15px rgba(0,0,0,.9);
}

h1{
font-size:3rem;
margin-bottom:20px;
color:#ff003c;
}

p{
font-size:1.2rem;
max-width:700px;
line-height:2;
margin-bottom:20px;
}

.date{
font-size:1.3rem;
background:rgba(255,0,60,.8);
padding:10px 20px;
border-radius:20px;
color:white;
}

.heart{
position:fixed;
top:-50px;
color:#ff003c;
font-size:22px;
animation:fall linear forwards;
z-index:4;
}

@keyframes fall{
to{
transform:translateY(110vh);
}
}
</style>
</head>

<body>

<div class="slideshow">
<img src="photo1.jpg" class="slide active">
<img src="photo2.jpg" class="slide">
<img src="photo3.jpg" class="slide">
<img src="photo4.jpg" class="slide">
<img src="photo5.jpg" class="slide">
<img src="photo6.jpg" class="slide">
<img src="photo7.jpg" class="slide">
<img src="photo8.jpg" class="slide">
<img src="photo9.jpg" class="slide">
</div>

<div class="overlay"></div>

<div class="content">
<h1>Melika ❤️ Alireza</h1>

<p>
از بین تمام اتفاق‌های دنیا،
قشنگ‌ترینش آشنایی ما بود...
</p>

<p>
هر عکسی که اینجا می‌بینی،
یه تیکه از خاطرات قشنگ ماست.
</p>

<p>
دوستت دارم بیشتر از چیزی که بشه با کلمات گفت. ❤️
</p>

<div class="date">
1404/09/18 - 11:22
</div>
</div>

<audio autoplay loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<script>
let slides=document.querySelectorAll('.slide');
let current=0;

setInterval(()=>{
slides[current].classList.remove('active');
current=(current+1)%slides.length;
slides[current].classList.add('active');
},4000);

function createHeart(){
let heart=document.createElement('div');
heart.classList.add('heart');
heart.innerHTML='❤';

heart.style.left=Math.random()*100+'vw';
heart.style.animationDuration=(6+Math.random()*4)+'s';

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},10000);
}

setInterval(createHeart,1200);
</script>

</body>
</html>
